name: Voice agent

on:
  pull_request:
    paths:
      - '.github/workflows/voice-agent.yml'
      - 'ods/extensions/library/services/voice-agent/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/voice-agent.yml'
      - 'ods/extensions/library/services/voice-agent/**'

permissions:
  contents: read

concurrency:
  group: voice-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ods/extensions/library/services/voice-agent
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      - name: Install the exact production environment
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/python" -m pip install --require-hashes -r requirements.lock
          "$RUNNER_TEMP/runtime/bin/python" -m pip check
      - name: Verify the lock matches its input
        run: |
          python -m pip install 'uv==0.12.19'
          uv pip compile requirements.txt --universal --python-version 3.11 --generate-hashes --no-header --no-annotate --index-url https://pypi.org/simple -o requirements.lock
          git diff --exit-code -- requirements.lock
      - name: Audit the locked distributions
        run: |
          python -m pip install 'pip-audit==2.10.1'
          python -m pip_audit --require-hashes -r requirements.lock
      - name: Run a full call against fake STT, LLM and TTS services
        run: |
          "$RUNNER_TEMP/runtime/bin/python" -m pip install 'pytest==9.1.1' 'pytest-asyncio==1.4.0'
          "$RUNNER_TEMP/runtime/bin/python" -m pytest -q tests
      - name: Build the image
        run: docker build -t ods-voice-agent:ci .
